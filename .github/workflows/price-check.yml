name: Competitor price check

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skus:
        description: "Product names or SKUs (comma or newline separated). Leave empty to use products.csv or skus.txt"
        required: false
        default: ""
      products_csv:
        description: "Repository-relative CSV path (sku,name,unit_price). Overrides SKUS."
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * 1"   # Mondays 05:00 Nairobi time (02:00 UTC). Delete this block to run manually only.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Require ScraperAPI secret
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          if [ -z "$SCRAPER_API_KEY" ]; then
            echo "::error::Set the SCRAPER_API_KEY repository secret before running the scraper."
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - name: Run price check
        id: price-check
        continue-on-error: true
        env:
          SKUS: ${{ github.event.inputs.skus }}
          PRODUCTS_CSV: ${{ github.event.inputs.products_csv }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: node batch.js
      - name: Ensure dashboard output exists
        if: always()
        run: |
          if [ ! -s site/index.html ]; then
            mkdir -p site
            cp index.html site/index.html
          fi
          if [ ! -s site/results.json ]; then
            printf '{"generated_at":"Price check failed; no fresh results were generated.","records":[]}\n' > site/results.json
          fi
      - name: Keep results as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-check-results
          path: site/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Report price-check failure after publishing
        if: steps.price-check.outcome == 'failure'
        run: |
          echo "::error::The dashboard was published, but the price check failed. See the Run price check step and downloadable artifact."
          exit 1

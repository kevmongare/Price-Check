name: Competitor price check

on:
  workflow_dispatch:
    inputs:
      skus:
        description: "Product names or SKUs (comma or newline separated). Leave empty to use skus.txt"
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * 1"   # Mondays 05:00 Nairobi time (02:00 UTC). Delete this block to run manually only.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Run price check
        env:
          SKUS: ${{ github.event.inputs.skus }}
        run: node batch.js
      - name: Keep results as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-check-results
          path: site/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
